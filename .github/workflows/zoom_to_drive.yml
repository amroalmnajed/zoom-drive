name: Zoom to Drive Automation

on:
  schedule:
    # Runs automatically every 6 hours (UTC 00:00, 06:00, 12:00, 18:00)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows you to trigger it manually anytime from your phone or GitHub
    inputs:
      days:
        description: 'Number of lookback days'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  process-recordings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create .env Configuration (One-Paste Support)
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || vars.ENV_FILE }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s\n' "$ENV_CONTENT" > .env
            echo "Successfully created .env file ($(wc -l < .env) lines loaded)."
          else
            echo "::error::ENV_FILE secret was not found or is empty! Please verify under GitHub Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Run Pipeline (Zoom -> Cloud -> Google Drive)
        env:
          PYTHONUNBUFFERED: "1"
          SERVER_MODE: "1"
        run: |
          DAYS="${{ inputs.days }}"
          python bot_runtime.py --days "${DAYS:-7}"

      - name: Save State Files (Commit processed.json)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.json undo_history.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update processed state [skip ci]" && git push)
