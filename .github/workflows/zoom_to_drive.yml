name: Zoom to Drive Automation

on:
  schedule:
    # Runs automatically every 6 hours (UTC 00:00, 06:00, 12:00, 18:00)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows you to trigger it manually anytime from your phone or GitHub
    inputs:
      days:
        description: 'Number of lookback days'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  process-recordings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pipeline (Zoom -> Cloud -> Google Drive)
        env:
          PYTHONUNBUFFERED: "1"
          SERVER_MODE: "1"
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_USER_ID: ${{ secrets.ZOOM_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOLDER_ID_1: ${{ secrets.FOLDER_ID_1 }}
          FOLDER_ID_2: ${{ secrets.FOLDER_ID_2 }}
          FOLDER_ID_3: ${{ secrets.FOLDER_ID_3 }}
          FOLDER_ID_4: ${{ secrets.FOLDER_ID_4 }}
          GOOGLE_TOKEN_MAIN_JSON: ${{ secrets.GOOGLE_TOKEN_MAIN_JSON }}
          GOOGLE_TOKEN_CRASH_JSON: ${{ secrets.GOOGLE_TOKEN_CRASH_JSON }}
          GOOGLE_TOKEN_G10_JSON: ${{ secrets.GOOGLE_TOKEN_G10_JSON }}
          GOOGLE_TOKEN_G9_JSON: ${{ secrets.GOOGLE_TOKEN_G9_JSON }}
          LOCAL_TIMEZONE: "Africa/Cairo"
        run: |
          python bot_runtime.py --days ${{ github.event.inputs.days || '7' }}

      - name: Save State Files (Commit processed.json)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.json undo_history.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update processed state [skip ci]" && git push)
